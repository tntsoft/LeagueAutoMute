name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = "dist\LeagueAutoMute"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\league_auto_mute.exe, README.md $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\LeagueAutoMute-$tag.zip" -Force
          Get-ChildItem dist -File | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: League Auto Mute ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/LeagueAutoMute-${{ github.ref_name }}.zip
            target/release/league_auto_mute.exe
